<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraWeb - Minha Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-flora-black d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-flora-black border-bottom border-flora-green sticky-top py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-flora-green fs-4" href="#">
            <i class="bi bi-flower1 fs-2"></i> FloraWeb
        </a>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-flora-green d-flex align-items-center gap-2 font-weight-bold" data-bs-toggle="modal" data-bs-target="#modalPlanta" onclick="limparFormulario()">
                <i class="bi bi-plus-lg fs-5"></i> <span class="d-none d-sm-inline">Nova Planta</span>
            </button>
            <button class="btn btn-outline-secondary" onclick="alternarTema()">
                <i class="bi bi-sun-fill" id="iconeTema"></i>
            </button>
            <a href="index.html" class="btn btn-flora-outline py-1 px-3 fs-6" title="Sair">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<main class="container py-4 my-2">

    <div class="row g-3 mb-4">
        <div class="col-md-8">
            <div class="input-group">
                    <span class="input-group-text bg-flora-dark border-flora-green text-flora-green">
                        <i class="bi bi-search"></i>
                    </span>
                <input type="text" id="inputBusca" class="form-control bg-flora-dark border-flora-green text-light" placeholder="Buscar por nome popular, científico ou categoria..." onkeyup="filtrarPlantas()">
            </div>
        </div>
        <div class="col-md-4">
            <select id="selectDificuldade" class="form-select bg-flora-dark border-flora-green text-light" onchange="filtrarPlantas()">
                <option value="">Todas as dificuldades</option>
                <option value="Fácil">Fácil</option>
                <option value="Médio">Médio</option>
                <option value="Difícil">Difícil</option>
            </select>
        </div>
    </div>

    <!-- Grid limpo onde o JS injeta as plantas do backend -->
    <div id="gridPlantas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
</main>

<div class="modal fade" id="modalPlanta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-flora-card border-flora-green text-light">
            <div class="modal-header border-bottom border-flora-green">
                <h5 class="modal-title fw-bold text-flora-green" id="modalTitulo">
                    <i class="bi bi-flower2 me-2"></i>Cadastrar Espécie
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formPlanta">
                    <input type="hidden" id="plantaId">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="nomePopular" class="form-label small fw-medium">Nome Popular *</label>
                            <input type="text" class="form-control bg-flora-dark border-flora-green text-light" id="nomePopular" placeholder="Ex: Costela-de-Adão" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nomeCientifico" class="form-label small fw-medium">Nome Científico</label>
                            <input type="text" class="form-control bg-flora-dark border-flora-green text-light" id="nomeCientifico" placeholder="Ex: Monstera deliciosa">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="categoria" class="form-label small fw-medium">Categoria</label>
                            <input type="text" class="form-control bg-flora-dark border-flora-green text-light" id="categoria" placeholder="Ex: Foliagem, Suculenta, Medicinal">
                        </div>
                        <div class="col-md-6">
                            <label for="nivelDificuldade" class="form-label small fw-medium">Dificuldade de Cultivo</label>
                            <select class="form-select bg-flora-dark border-flora-green text-light" id="nivelDificuldade">
                                <option value="Fácil">Fácil</option>
                                <option value="Médio">Médio</option>
                                <option value="Difícil">Difícil</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="iluminacao" class="form-label small fw-medium">Iluminação</label>
                            <input type="text" class="form-control bg-flora-dark border-flora-green text-light" id="iluminacao" placeholder="Ex: Sol pleno / Meia-sombra">
                        </div>
                        <div class="col-md-4">
                            <label for="rega" class="form-label small fw-medium">Frequência de Rega</label>
                            <input type="text" class="form-control bg-flora-dark border-flora-green text-light" id="rega" placeholder="Ex: 2 a 3 vezes/semana">
                        </div>
                        <div class="col-md-4">
                            <label for="temperatura" class="form-label small fw-medium">Temperatura Ideal</label>
                            <input type="text" class="form-control bg-flora-dark border-flora-green text-light" id="temperatura" placeholder="Ex: 20°C a 30°C">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label small fw-medium">Orientações de Cuidado / Descrição</label>
                        <textarea class="form-control bg-flora-dark border-flora-green text-light" id="descricao" rows="3" placeholder="Informações adicionais sobre poda, adubação ou características..."></textarea>
                    </div>

                    <div class="text-end pt-2 border-top border-flora-green">
                        <button type="button" class="btn btn-flora-outline me-2" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-flora-green fw-bold">Salvar Planta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="bg-flora-black border-top border-flora-green py-3 text-center text-secondary small mt-auto">
    <div class="container">
        <p class="mb-0">FloraWeb &copy; 2026 — Projeto AEP | Unicesumar</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
