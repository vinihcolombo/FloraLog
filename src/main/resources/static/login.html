<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraWeb - Entrar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-flora-black d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-flora-black border-bottom border-flora-green py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-flora-green fs-4" href="/index.html">
                <i class="bi bi-flower1 fs-2"></i> FloraWeb
            </a>
            <a href="index.html" class="text-secondary text-hover-green text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Voltar ao início
            </a>
        </div>
    </nav>

    <main class="container my-auto py-5 d-flex justify-content-center align-items-center">
        <div class="card bg-flora-card border-flora-green shadow-lg p-4 style-card-auth" style="max-width: 420px; width: 100%;">
            <div class="card-body">
                
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle text-flora-green display-4 d-block mb-2"></i>
                    <h3 class="fw-bold text-light">Acessar Conta</h3>
                    <p class="text-secondary small">Entre para gerenciar suas plantas e coleções.</p>
                </div>

                <form id="formLogin">
                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-light small fw-medium">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-flora-dark border-flora-green text-flora-green">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control bg-flora-dark border-flora-green text-light" id="email" placeholder="seuemail@exemplo.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="senha" class="form-label text-light small fw-medium mb-0">Senha</label>
                            <a href="#" class="text-secondary text-hover-green text-decoration-none extra-small">Esqueceu?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-flora-dark border-flora-green text-flora-green">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-flora-dark border-flora-green text-light" id="senha" placeholder="Sua senha" required>
                        </div>
                    </div>

                    <div id="mensagem" class="mb-3 d-none"></div>

                    <button type="submit" class="btn btn-flora-green w-100 py-2 fw-bold mb-4">
                        Entrar
                    </button>

                    <div class="position-relative text-center mb-4">
                        <hr class="border-flora-green opacity-50 m-0">
                        <span class="position-absolute top-50 start-50 translate-middle bg-flora-card px-2 text-secondary small">
                            ou
                        </span>
                    </div>

                    <div class="text-center">
                        <p class="text-secondary small mb-2">Ainda não possui uma conta?</p>
                        <a href="cadastro.html" class="btn btn-flora-outline w-100 py-2 fw-bold">
                            Criar Nova Conta
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <footer class="bg-flora-black border-top border-flora-green py-3 text-center text-secondary small mt-auto">
        <div class="container">
            <p class="mb-0">FloraWeb &copy; 2026 — Projeto AEP | Unicesumar</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
